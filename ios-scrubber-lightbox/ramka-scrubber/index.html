    <div id="root"></div>
    <script>
      // Same polyfill gate as the ios-scrubber page: the scrubber strip's
      // expand look uses animation-timeline when it's scrolling itself (see
      // shared/effects/expand.js), so browsers without native support need
      // this loaded before that CSS runs.
      if (!CSS.supports("animation-timeline: --works")) {
        const s = document.createElement("script");
        s.src = "../shared/vendor/scroll-timeline.js";
        s.async = false;
        document.currentScript.after(s);
      }
    </script>
    <script type="module" src="/src/ramka-scrubber/main.jsx"></script>
