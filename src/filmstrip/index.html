<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Filmstrip scrubber</title>
  <link rel="stylesheet" href="filmstrip.css" />
</head>

<body>
  <nav>
    <a href="../">index</a>
    <a href="../scale-fade/">scale-fade</a>
    <a href="../filmstrip/" class="current">filmstrip</a>
    <a href="../ios-scrubber/">ios scrubber</a>
    <a href="../archive/proto-v1/">archive</a>
  </nav>

  <main>
    <h1>Filmstrip scrubber <span class="build-stamp" id="build-stamp"></span></h1>
    <div class="carousel-controls">
      <label>
        Main, while following
        <select data-link-follower="main">
          <option value="instant" selected>Instant</option>
          <option value="continuous">Continuous</option>
        </select>
      </label>
      <label>
        Strip, while following
        <select data-link-follower="strip">
          <option value="instant">Instant</option>
          <option value="continuous" selected>Continuous</option>
        </select>
      </label>
      <label>
        Main, remove contrast
        <select data-contrast-for="main">
          <option value="never" selected>Never</option>
          <option value="leading">Leading</option>
          <option value="following">Following</option>
          <option value="always">Always</option>
        </select>
      </label>
      <label>
        Strip, remove contrast
        <select data-contrast-for="strip">
          <option value="never" selected>Never</option>
          <option value="leading">Leading</option>
          <option value="following">Following</option>
          <option value="always">Always</option>
        </select>
      </label>
    </div>
    <div class="carousel-wrapper main-carousel placeholder-boxes" id="main-carousel"></div>
    <div class="carousel-wrapper thumbnail-scrubber-strip placeholder-boxes" id="strip"></div>
  </main>

  <script>
    // Loaded ahead of the entry script, synchronously, so every rule the look
    // generates is inserted into a document that already has the polyfill's
    // MutationObserver watching for it. The polyfill patches CSS.supports to
    // report animation-timeline as supported, which is deliberate - it keeps
    // feature queries in the page's own CSS from skipping the declarations it
    // exists to interpret - and nothing here asks that question.
    if (!CSS.supports("animation-timeline: --works")) {
      const s = document.createElement("script");
      s.src = "../shared/vendor/scroll-timeline.js";
      s.async = false;
      document.currentScript.after(s);
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
